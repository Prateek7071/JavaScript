<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profession Management System</title>
	<link rel="styleSheet" href="style.css">
</head>
<body>
    <h3>New Employees</h3>
    <form class="details" onSubmit>  
        <div class="field">
            <label for="name">Enter Name</label>
            <label for="profession">Enter Profession</label>
            <label for="age">Enter Age</label><br>
            <input type="text" id="name" name="name">
            <input type="text" id="profession" name="profession">
            <input type="text" id="age" name="age">
        </div>
        <div class="button">
            <button type="submit" id="addBtn">Add User</button>
        </div>
    </form>
    <div class="user-feedback" id="feedback">
        <span class="feedback" id="feedbackMsg"></span>
    </div>
    <div class="message">
        <h3>Added Employees</h3>
        
    </div>
    <div class="user-feedback" id="feedback">
        <span class="feedback" id="feedback-message"></span>
    </div>
    <div class="count">
        <p id="count">You have 0 Employees.</p> 
    </div>
    <div class="list" id="eList">
        
    </div>
    <script src="script.js"></script>
</body>
</html>
